<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Modal</title>
    <style>
      
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            width: 90%;
            max-width: 850px;
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        .close-btn {
            position: absolute;
            right: 25px;
            top: 15px;
            font-size: 30px;
            cursor: pointer;
            color: #067593;
            z-index: 100;
        }

        .modal-body-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .login-form-side {
            padding: 50px;
            font-family: sans-serif;
        }

        .welcome-text {
            color: #067593;
            font-weight: bold;
            margin-bottom: 25px;
            margin-top: 5px;
        }

        .modal-input {
            width: 100%;
            padding: 12px 20px;
            margin-bottom: 15px;
            border-radius: 30px;
            border: 1px solid #e0e0e0;
            background: #f8f8f8;
            outline: none;
            box-sizing: border-box;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .form-options a {
            color: #666;
            text-decoration: none;
        }

        .signin-btn {
            background: #004d61;
            color: white;
            padding: 12px 45px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        .signup-text {
            margin-top: 25px;
            font-size: 14px;
            color: #666;
        }

        .signup-text a {
            color: #067593;
            font-weight: bold;
            text-decoration: none;
        }

        .login-image-side img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        @media (max-width: 768px) {
            .modal-content {
                flex-direction: column;
                width: 90%;
                max-width: 500px;
            }

            .login-image {
                display: none;
            }

            .login-form {
                padding: 30px 20px;
            }

            .login-form h1 {
                font-size: 32px;
            }

            .login-form h2 {
                font-size: 20px;
            }

            .login-input {
                padding: 10px 15px;
                font-size: 14px;
            }

            .signin-btn {
                width: 100%;
                padding: 12px;
            }
        }

        @media (max-width: 480px) {
            .modal-content {
                width: 95%;
            }

            .login-form h1 {
                font-size: 28px;
            }

            .login-form h2 {
                font-size: 18px;
            }

            .login-input {
                padding: 8px 12px;
                font-size: 13px;
            }

            .signin-btn {
                padding: 10px;
                font-size: 14px;
            }

            .form-options {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
                font-size: 12px;
            }

            .form-options a {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeLoginModal()">&times;</span>

            <div class="modal-body-grid">
                <div class="login-form-side">
                    <h2 style="margin:0; font-weight: normal;">Holla,</h2>
                    <h1 class="welcome-text">Welcome Back</h1>

                    <form onsubmit="return false;">
                        <input type="text" placeholder="Name / Surname" class="modal-input">
                        <input type="password" placeholder="Password" class="modal-input">

                        <div class="form-options">
                            <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                                <input type="checkbox"> Remember Me
                            </label>
                            <a href="#" class="forgot-link">Forgot Password?</a>
                        </div>

                        <button type="submit" class="signin-btn">Sign in</button>
                    </form>

                    <p class="signup-text">Don't have an account? <a href="#">sign up</a></p>
                </div>

                <div class="login-image-side">
                    <img src="photo/why/Group 1413372121.png" alt="Welcome Image">
                </div>
            </div>
        </div>
    </div>

    <script>
        var modal = document.getElementById("loginModal");

        function openLoginModal() {
            modal.style.display = "block";
            document.body.style.overflow = "hidden";
        }

        function closeLoginModal() {
            modal.style.display = "none";
            document.body.style.overflow = "auto";
        }

        window.onclick = function (event) {
            if (event.target == modal) {
                closeLoginModal();
            }
        }
    </script>
</body>

</html>
