<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="container">
        <div class="logo">
            <img src="photo/Frame 1.png" alt="">
        </div>
        <div>
                <a href="index.html">Home </a>
                <a href="why.html">About</a>
                <a href="why.html">Services</a>
                <a href="contact.html">Contect Us</a>
            </div>
            <div>
                <div id="modal-placeholder"></div>
                <a href="javascript:void(0)" class="btn" onclick="loadAndOpenModal()">Login</a>
                <a href="join.html" class="btn" >Join Team</a>
            </div>
    </header>

    <section class="profile-hero-section">
        <div class="container profile-grid-container">

            <div class="profile-card1 profile-info-card">
                <div class="profile-in-card">
                    <div class="image-holder">

                        <div class="image-holder">
                            <img src="photo/why/Rectangle 34627514.png" alt="Suzy Swift">
                        </div>
                        <button class="upload-btn-new">Upload Image <img src="photo/why/Vector.png" alt=""></button>
                    </div>
                    <h2>Suzy Swift</h2>
                    <form class="card-form">

                        <select>
                            <option>Country Of Origin</option>
                        </select>
                        <input type="text" placeholder="Bio">
                        <input type="text" placeholder="Instagram Profile URL">
                        <input type="text" placeholder="Facebook Profile URL">
                        <input type="text" placeholder="Linkedin Profile URL">
                    </form>
                </div>
            </div>

            <div class="profile-card profile-details-main">
                <div class="dashed-border-box">
                    <h2>My Profile</h2>
                    <div class="input-grid">
                        <select>
                            <option>Date Of Birth</option>
                        </select>
                        <select>
                            <option>Nationality</option>
                        </select>
                        <div class="phone-group">
                            <select>
                                <option>+971</option>
                            </select>
                            <input type="text" placeholder="Phone Number">
                        </div>
                        <select>
                            <option>Whatsapp Number</option>
                        </select>
                        <select>
                            <option>Gender</option>
                        </select>
                        <select>
                            <option>Country Of Residence</option>
                        </select>
                        <input type="text" placeholder="City Of Residence" class="full-row">
                    </div>
                </div>
            </div>

            <div class="profile-card details-section">
                <h2>My Details</h2>
                <div class="input-grid1">
                    <select>
                        <option>Experience</option>
                    </select>
                    <select>
                        <option>Languages Spoken</option>
                    </select>
                    <select>
                        <option>Availability</option>
                    </select>
                    <select>
                        <option>Select A Visa Type</option>
                    </select>
                    <input type="text" placeholder="Average Rate Per Hour">
                    <select>
                        <option>Do You Have Your Own Car?</option>
                    </select>
                    <input type="text" placeholder="Height in CM">
                    <input type="text" placeholder="Weight in KG">
                </div>
            </div>

            <div class="profile-card upload-section">
                <div class="section-header">
                    <h2>Upload Images</h2>
                    <span>upload image/video</span>
                </div>
                <div class="upload-grid">
                    <div class="upload-item">
                        <div class="upload-box"> </div>
                        <button class="upload-btn-new"> Full length <img src="photo/Vector.png" alt=""></button>
                    </div>
                    <div class="upload-item">
                        <div class="upload-box"> </div>
                        <button class="upload-btn-new"> Head shot <img src="photo/Vector.png" alt=""></button>
                    </div>
                    <div class="upload-item">
                        <div class="upload-box"> </div>
                        <button class="upload-btn-new"> Waist up <img src="photo/Vector.png" alt=""></button>
                    </div>
                    <div class="upload-item">
                        <div class="upload-box"> </div>
                        <button class="upload-btn-new"> Add Video <img src="photo/Vector.png" alt=""></button>
                    </div>
                </div>
                <p class="upload-note">No Selfies / Screenshots / Low Resolution Images</p>
            </div>

            <div class="action-footer">
                <a href="#">Terms & Conditions</a>
                <button class="save-btn">Save & Submit</button>
            </div>

        </div>
    </section>

</body>

</html>
